[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexopass-backend"
version = "0.1.0"
description = "Persistencia y migraciones del prototipo NexoPass"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy==2.0.55",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "pydantic==2.14.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx2==2.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
